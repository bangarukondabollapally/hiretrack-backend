version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: hiretrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${DB_NAME:-hiretrack}
      MYSQL_USER: ${DB_USERNAME:-hiretrack_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hiretrack@2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiretrack-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hiretrack}
      DB_USERNAME: ${DB_USERNAME:-hiretrack_app}
      DB_PASSWORD: ${DB_PASSWORD:-hiretrack@2026}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
